<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>برای شادونم ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma,sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

background:linear-gradient(-45deg,#ff6fa9,#ff91c1,#ffd1e6,#ff8fb1);

background-size:400% 400%;

animation:bg 10s ease infinite;

}

@keyframes bg{

0%{background-position:0 50%;}

50%{background-position:100% 50%;}

100%{background-position:0 50%;}

}

.card{

width:90%;

max-width:380px;

min-height:350px;

background:rgba(255,255,255,.2);

backdrop-filter:blur(15px);

padding:35px;

border-radius:30px;

text-align:center;

box-shadow:0 20px 40px rgba(0,0,0,.2);

animation:show .8s;

position:relative;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

}

@keyframes show{

from{

opacity:0;

transform:translateY(60px) scale(.8);

}

to{

opacity:1;

transform:translateY(0) scale(1);

}

}

h1{

font-size:34px;

color:white;

margin-bottom:20px;

position:relative;

}

p{

font-size:22px;

color:white;

margin-bottom:25px;

transition:.3s;

}

button{

padding:15px 35px;

font-size:20px;

border:none;

border-radius:60px;

cursor:pointer;

margin:8px;

transition:.3s;

}

#yes{

background:#ff2e74;

color:white;

z-index: 10;

}

#no{

background:white;

z-index: 10;

}

.btn-group{

display:flex;

justify-content:center;

align-items:center;

gap:10px;

width:100%;

position:relative;

min-height:80px;

}

.heart{
position:fixed;
top:-30px;
font-size:22px;
animation:fall linear forwards;
pointer-events:none;
}

@keyframes fall{

0%{
transform:translateY(-30px) rotate(0deg);
opacity:1;
}

100%{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}

}
.envelope{
width:220px;
height:140px;
background:#fff;
border-radius:10px;
position:relative;
margin:auto;
cursor:pointer;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.envelope:before{
content:"💌";
font-size:60px;
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
}

.letter{
display:none;
margin-top:25px;
background:white;
padding:20px;
border-radius:20px;
color:#ff2d75;
font-size:20px;
line-height:2;
animation:show .5s;
}

.confetti{
position:fixed;
top:-20px;
font-size:18px;
pointer-events:none;
animation:confettiFall linear forwards;
}

@keyframes confettiFall{
0%{
transform:translateY(-20px) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(110vh) rotate(720deg);
opacity:0;
}
}


</style>

</head>

<body>

<div class="card" id="cardBox">

<h1 id="titleName">❤️ سلام شادونم</h1>

<p id="text">

با من میای قرار؟ 🥹

</p>

<div class="btn-group">

<button id="yes">

آره 😍

</button>

<button id="no">

نه 🙄

</button>

</div>

</div>

<script>

const no=document.getElementById("no");
const yes=document.getElementById("yes");
const text=document.getElementById("text");
const cardBox=document.getElementById("cardBox");
const titleName=document.getElementById("titleName");

let count=0;

const messages=[
"خواهش میکنم دورت بگردم 🥺💓",
"تروخدااااا قلبم 💖✨",
"فندقم لطفااااا 💕🥹",
"مگه میتونی به من نه بگی اخه؟ 💘🥺",
"دلمو نشکن دیگه مهربونم 💔🥹",
"انقدر دور اسمت میگردم تا قبول کنیییی ❤️‍🔥🙈"
];

no.onclick=function(){

count++;

if(count<=messages.length){
text.innerHTML=messages[count-1];
}

if(count>messages.length){
no.style.display="none";
text.innerHTML="راهی نیست باید بگی آره زندگیم 😌❤️";
}

// جابه‌جایی دقیق دکمه نه دور کادرِ عنوان «سلام شادونم»
const cardRect = cardBox.getBoundingClientRect();
const titleRect = titleName.getBoundingClientRect();

// مرکز اسم شادونم نسبت به کارت اصلی
const centerX = (titleRect.left + titleRect.width / 2) - cardRect.left;
const centerY = (titleRect.top + titleRect.height / 2) - cardRect.top;

// شعاع چرخش دور اسم
const radius = 85 + Math.random() * 35;
const angle = Math.random() * Math.PI * 2;

const btnWidth = no.offsetWidth || 70;
const btnHeight = no.offsetHeight || 40;

let x = centerX + radius * Math.cos(angle) - (btnWidth / 2);
let y = centerY + radius * Math.sin(angle) - (btnHeight / 2);

// اطمینان از قرارگیری در محدوده‌ی کارت
x = Math.max(10, Math.min(x, cardRect.width - btnWidth - 10));
y = Math.max(10, Math.min(y, cardRect.height - btnHeight - 10));

no.style.position="absolute";
no.style.left=x+"px";
no.style.top=y+"px";

yes.style.transform="scale("+(1+count*0.12)+")";

}

yes.onclick=function(){

document.body.innerHTML=`

<div style="height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;background:linear-gradient(135deg,#ff5fa2,#ffb6d9);padding:20px;">

<div class="envelope" onclick="openLetter()"></div>

<div class="letter">

شادونم ❤️

<br><br>

از اینکه گفتی آره...

واقعاً خوشحال شدم 🥹

<br><br>

قول میدم کاری کنم هر لحظه کنارم برات قشنگ باشه.

<br><br>

دوستت دارم ❤️

</div>

</div>

`;

}

function createHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(3+Math.random()*3)+"s";

heart.style.fontSize=(15+Math.random()*25)+"px";

document.body.appendChild(heart);

setTimeout(()=>{

heart.remove();

},6000);

}

setInterval(createHeart,300);
function openLetter(){

document.body.innerHTML=`

<div style="height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff5fa2,#ffb6d9);
padding:20px;
text-align:center;">

<h2 style="color:white;font-size:32px;">
شادونم ❤️
</h2>

<p style="color:white;font-size:20px;margin:20px;">
چه روزی بریم قرار؟ 🥰
</p>

<input
type="date"
id="date"
style="
padding:15px;
font-size:20px;
border:none;
border-radius:15px;
margin-bottom:20px;
">

<button onclick="nextStep()"
style="
padding:15px 40px;
border:none;
border-radius:50px;
background:#ff2d75;
color:white;
font-size:20px;
">

بعدی ❤️

</button>

</div>

`;

}
function nextStep(){
  if(!document.getElementById("date").value){
alert("اول تاریخ رو انتخاب کن ❤️");
return;
}

let date=document.getElementById("date").value;

document.body.innerHTML=`

<div style="height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(135deg,#ff5fa2,#ffb6d9);">

<h2 style="color:white;">
ساعت چند؟ ⏰
</h2>

<input
type="time"
id="time"
style="
padding:15px;
font-size:20px;
border:none;
border-radius:15px;
margin:20px;
">

<button onclick="finish('${date}')"
style="
padding:15px 40px;
background:#ff2d75;
border:none;
border-radius:50px;
color:white;
font-size:20px;
">

بعدی ❤️

</button>

</div>

`;

}
function finish(date){
  if(!document.getElementById("time").value){
alert("اول ساعت رو انتخاب کن ❤️");
return;
}

let time=document.getElementById("time").value;

document.body.innerHTML=`

<div style="
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff5fa2,#ffb6d9);
padding:20px;
">

<h2 style="color:white;">کجا بریم؟ 🥰</h2>

<button onclick="lastPage('${date}','${time}','☕ کافه')">☕ کافه</button>

<button onclick="lastPage('${date}','${time}','🎬 سینما')">🎬 سینما</button>

<button onclick="lastPage('${date}','${time}','🍕 شام')">🍕 شام</button>

<button onclick="lastPage('${date}','${time}','🌳 پارک')">🌳 پارک</button>

<button onclick="lastPage('${date}','${time}','🍦 بستنی')">🍦 بستنی</button>

<button onclick="customPlace('${date}','${time}')">✍️ خودت بگو...</button>

</div>

`;


}

function customPlace(date, time){
  document.body.innerHTML=`
  <div style="
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff5fa2,#ffb6d9);
  padding:20px;
  text-align:center;
  ">
  <h2 style="color:white;margin-bottom:20px;">دوست داری کجا بریم؟ 💭</h2>
  <input type="text" id="customInput" placeholder="مثلاً: بریم شهربازی..." style="
  padding:15px;
  font-size:18px;
  border:none;
  border-radius:15px;
  margin-bottom:20px;
  width:80%;
  max-width:300px;
  text-align:center;
  ">
  <button onclick="submitCustomPlace('${date}','${time}')" style="
  padding:15px 40px;
  background:#ff2d75;
  border:none;
  border-radius:50px;
  color:white;
  font-size:20px;
  ">ثبت ❤️</button>
  </div>
  `;
}

function submitCustomPlace(date, time){
  let place = document.getElementById("customInput").value;
  if(!place){
    alert("لطفاً یک جا برام بنویس ❤️");
    return;
  }
  lastPage(date, time, "✨ " + place);
}

function lastPage(date,time,place){
  confetti();

document.body.innerHTML=`

<div style="
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(135deg,#ff5fa2,#ffb6d9);
color:white;
text-align:center;
padding:25px;
">

<h1>❤️ قرارمون ثبت شد ❤️</h1>

<p style="margin-top:15px;font-size:20px;line-height:1.6;">
مرسی دختر کوچولوی قشنگم که قبول کردی 🥹<br>
قول میدم خیلی بهت خوش بگذره ❤️
</p>

<h2 style="margin-top:20px;">
📅 ${date}
</h2>

<h2>
🕒 ${time}
</h2>

<h2>
${place}
</h2>

<div id="countdown" style="
margin-top:20px;
font-size:18px;
background:rgba(255,255,255,0.2);
padding:15px 20px;
border-radius:20px;
font-weight:bold;
line-height:1.5;
">
در حال محاسبه زمان... ⏳
</div>

<p style="margin-top:20px;font-size:22px;">
بی‌صبرانه منتظرتم شادونم 🥹❤️
</p>
<button onclick="location.reload()"
style="
margin-top:20px;
padding:15px 35px;
border:none;
border-radius:50px;
background:white;
color:#ff2d75;
font-size:20px;">
🔄 دوباره
</button>
</div>

`;

startCountdown(date, time);

}

function startCountdown(dateStr, timeStr){
  const targetDate = new Date(`${dateStr}T${timeStr}:00`);
  
  const timer = setInterval(() => {
    const now = new Date();
    const diff = targetDate - now;

    if (diff <= 0) {
      clearInterval(timer);
      document.getElementById("countdown").innerHTML = "وقت قراره! 😍🎉";
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / 1000 / 60) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("countdown").innerHTML = 
      `⏳ چقدر مونده:<br>${days} روز و ${hours} ساعت و ${minutes} دقیقه و ${seconds} ثانیه`;
  }, 1000);
}

function confetti(){

const items=["🎉","✨","🎊","💖","🌸"];

for(let i=0;i<40;i++){

let c=document.createElement("div");

c.className="confetti";

c.innerHTML=items[Math.floor(Math.random()*items.length)];

c.style.left=Math.random()*100+"vw";

c.style.fontSize=(20+Math.random()*20)+"px";

c.style.animationDuration=(2+Math.random()*3)+"s";

document.body.appendChild(c);

setTimeout(()=>c.remove(),5000);

}

}

</script>

</body>

</html>
